name: daily-crawl

# 🔴 이 저장소는 반드시 PUBLIC 이어야 한다.
#    PRIVATE 이면 Actions 실행 시간이 계정의 무료 분에서 깎인다(finrate-crawler 가 그렇다).
#    PUBLIC 이면 Actions 가 무제한 무료다. 비용 0을 지키는 조건이 이것 하나다.

on:
  schedule:
    # 🔴 크론을 고칠 땐 파일명도 같이 바꿔 재등록시킬 것(GitHub이 최초 등록 스케줄을 붙잡는다).
    - cron: "40 21 * * *"    # 06:40 KST — finrate 계열(07:00, 07:10)과 겹치지 않게
  workflow_dispatch: {}

concurrency:
  group: hf-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet beautifulsoup4

      # 직전 발행분을 남겨둔다. validate 가 이것과 비교해 급변을 잡는다.
      - name: Keep previous
        run: cp data/pension.json /tmp/prev.json || echo "첫 실행"

      - name: Crawl
        run: python crawler/crawl.py

      # 검증 실패 = 발행 안 함. 낡은 데이터가 틀린 데이터보다 낫다.
      - name: Validate
        run: python crawler/validate.py data/pension.json /tmp/prev.json

      - name: Commit if changed
        run: |
          git config user.name "hfpension-bot"
          git config user.email "actions@github.com"
          git add data/pension.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push

      # 60일간 저장소 활동이 없으면 GitHub이 스케줄 워크플로를 조용히 끈다.
      # 주택연금 표는 1년에 한 번 바뀌므로 커밋이 거의 안 생긴다 = 가장 위험한 케이스다.
      - name: Keepalive
        if: always()
        run: |
          DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$DAYS" -ge 30 ]; then
            date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
            git add .keepalive
            git commit -m "chore: keepalive (스케줄 워크플로 자동 비활성화 방지)"
            git push
          else
            echo "최근 ${DAYS}일 내 활동 있음 - keepalive 생략"
          fi
